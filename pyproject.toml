[project]
name = "ai-video-clipping-saas"
version = "0.1.0"
description = "Backend for an AI video clipping service"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.15"
strict = true
